<svg xmlns="http://www.w3.org/2000/svg" width="600" height="704" viewBox="0 0 600 704" role="img" aria-labelledby="title desc"><title id="title">Pedro Zampronha — código que conecta</title><desc id="desc">Formado em Sistemas de Informação pela ESPM. Desenvolvimento de software, integração de sistemas e dados. Jogos, RPG, animes e realidade virtual também fazem parte dos meus projetos.</desc><rect x="0" y="0" width="600" height="704" fill="#080C12"/><rect x="0" y="0" width="600" height="66" fill="#FCEE09"/><text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#080C12">PHBR63 // ARQUIVO PESSOAL</text><path d="M0 66H600V266L566 300H0Z" fill="#00F0FF"/><text x="30" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#080C12">CÓDIGO QUE</text><text x="30" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="700" fill="#080C12">CONECTA.</text><text x="32" y="256" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#080C12">IDEIAS EM MOVIMENTO</text><text x="30" y="359" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#00F0FF">FORMAÇÃO / ESPM</text><text x="30" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#F2F6FA">Sistemas de Informação</text><text x="30" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#F2F6FA">Desenvolvimento de software,</text><text x="30" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#F2F6FA">integração de sistemas</text><text x="30" y="565" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#F2F6FA">e dados.</text><rect x="30" y="611" width="540" height="58" fill="#FCEE09"/><text x="51" y="651" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#080C12">JOGOS / RPG / ANIMES / VR</text><rect x="0" y="696" width="600" height="8" fill="#FF375A"/></svg>
