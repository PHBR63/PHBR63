<svg xmlns="http://www.w3.org/2000/svg" width="600" height="776" viewBox="0 0 600 776" role="img" aria-labelledby="title desc"><title id="title">Pedro Zampronha — código que conecta</title><desc id="desc">Formado em Sistemas de Informação pela ESPM. Desenvolvimento de software, integração de sistemas e dados. Jogos, RPG, animes e realidade virtual também fazem parte dos meus projetos.</desc><rect x="0" y="0" width="600" height="776" fill="#080C12"/><rect x="0" y="0" width="600" height="80" fill="#FCEE09"/><text x="32" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#080C12">PHBR63 // ARQUIVO PESSOAL</text><path d="M0 80H600V286L566 320H0Z" fill="#00F0FF"/><text x="32" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#080C12">CÓDIGO QUE</text><text x="32" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="700" fill="#080C12">CONECTA.</text><text x="32" y="280" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#080C12">IDEIAS EM MOVIMENTO</text><text x="32" y="384" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#00F0FF">FORMAÇÃO / ESPM</text><text x="32" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#F2F6FA">Sistemas de Informação</text><text x="32" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#F2F6FA">Desenvolvimento de software,</text><text x="32" y="568" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#F2F6FA">integração de sistemas</text><text x="32" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#F2F6FA">e dados.</text><rect x="32" y="664" width="536" height="64" fill="#FCEE09"/><text x="52" y="706" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#080C12">JOGOS / RPG / ANIMES / VR</text><rect x="0" y="768" width="600" height="8" fill="#FF375A"/></svg>
